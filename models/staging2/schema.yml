version: 2

models:
  - name: stg_regions
    columns:
      - name: region_id
        description: forigen key for regions table
        data_tests:
          - relationships:
             arguments:
              to: ref('model_name')
              field: field_name
          - unique
          - not_null

      - name: name
        tests:
          - accepted_values:
              arguments:
                values: ['AFRICA', 'AMERICA', 'EUROPE', 'ASIA', 'MIDDLE EAST']

  - name: stg_nations
    columns:
      - name: nation_id
        tests:
          - unique
          - not_null

      - name: region_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_regions')
                field: region_id

seeds:
  - name: supplier_names
    config:
      alias: suppnames